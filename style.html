<style>

        /* =====================================================
           GLOBAL
        ====================================================== */

        * {
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            margin: 0;
            padding: 0;
            background: #ffffff;
            color: #111827;
            font-family: Georgia, "Times New Roman", serif;
        }

        .container {
            max-width: 1100px;
        }


        /* =====================================================
           NAVBAR
        ====================================================== */

        .navbar {
            background: #10172a !important;
            min-height: 88px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.18);
            position: sticky;
            top: 0;
            z-index: 9999;
        }

        .navbar-brand {
            color: #00bfae !important;
            font-size: 28px;
            font-weight: bold;
            line-height: 1;
        }

        .brand-subtitle {
            display: block;
            color: #d7dce5;
            font-size: 13px;
            margin-top: 7px;
            font-weight: normal;
        }

        .navbar-nav .nav-link {
            color: #ffffff !important;
            font-size: 15px;
            font-weight: bold;
            padding: 9px 13px !important;
            margin: 0 2px;
            border-radius: 5px;
            cursor: pointer;
            transition: 0.25s;
        }

        .navbar-nav .nav-link:hover {
            color: #00c7b5 !important;
        }

        .navbar-nav .nav-link.active {
            color: #00c7b5 !important;
        }

        .navbar-toggler {
            border: 1px solid #777;
        }

        .navbar-toggler:focus {
            box-shadow: none;
        }

        .navbar-toggler-icon {
            filter: invert(1);
        }


        /* =====================================================
           PAGE SYSTEM
        ====================================================== */

        .page {
            display: none;
            min-height: calc(100vh - 88px);
            padding: 60px 0 80px;
            animation: fadeIn 0.35s ease;
        }

        .page.active-page {
            display: block;
        }

        @keyframes fadeIn {

            from {
                opacity: 0;
                transform: translateY(8px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }

        }


        /* =====================================================
           HOME
        ====================================================== */

        .home-section {
            padding-top: 75px;
        }

        .availability {
            display: inline-block;
            background: #dcecff;
            color: #2161d1;
            padding: 7px 16px;
            border-radius: 20px;
            font-size: 15px;
            font-weight: bold;
            margin-bottom: 20px;
        }

        .home-title {
            font-size: 64px;
            line-height: 1.05;
            font-weight: bold;
            color: #20293a;
            margin-bottom: 25px;
        }

        .home-role {
            color: #2161e8;
            font-size: 25px;
            font-weight: bold;
            margin-bottom: 20px;
        }

        .home-tech {
            color: #55708e;
            font-size: 18px;
            margin-bottom: 28px;
        }

        .home-tech span {
            margin: 0 4px;
        }


        /* =====================================================
           HOME IMAGE
        ====================================================== */

        .hero-image-wrapper {
            width: 350px;
            height: 350px;
            margin: auto;
            border-radius: 50%;
            background: #fff;
            box-shadow: 0 10px 35px rgba(0,0,0,0.14);
            padding: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .hero-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 50%;
        }


        /* =====================================================
           HOME BUTTONS
        ====================================================== */

        .home-buttons {
            display: flex;
            gap: 14px;
            flex-wrap: wrap;
        }

        .home-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 12px 24px;
            border-radius: 7px;
            font-size: 15px;
            font-weight: bold;
            text-decoration: none;
            cursor: pointer;
            transition: 0.25s;
        }

        .home-btn.primary {
            background: #2864e8;
            color: white;
            border: 2px solid #2864e8;
        }

        .home-btn.primary:hover {
            background: #174fc7;
            border-color: #174fc7;
            color: white;
        }

        .home-btn.secondary {
            background: white;
            color: #2864e8;
            border: 2px solid #2864e8;
        }

        .home-btn.secondary:hover {
            background: #2864e8;
            color: white;
        }


        /* =====================================================
           HOME STATS
        ====================================================== */

        .stats-section {
            margin-top: 90px;
        }

        .stat-card {
            background: #ffffff;
            border-radius: 16px;
            padding: 38px 20px;
            text-align: center;
            box-shadow: 0 5px 20px rgba(0,0,0,0.08);
            height: 100%;
            transition: 0.25s;
        }

        .stat-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(0,0,0,0.12);
        }

        .stat-number {
            color: #2864e8;
            font-size: 34px;
            font-weight: bold;
            margin-bottom: 22px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-width: 120px;
        }

        .stat-label {
            color: #111;
            font-size: 16px;
        }


        /* =====================================================
           CORE TECHNOLOGIES
        ====================================================== */

        .core-section {
            margin-top: 100px;
            text-align: center;
        }

        .home-heading {
            font-size: 25px;
            font-weight: bold;
            margin-bottom: 30px;
            color: #111;
        }

        .technology-list {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 14px;
        }

        .technology {
            background: #2864e8;
            color: white;
            border-radius: 30px;
            padding: 13px 24px;
            font-weight: bold;
            transition: 0.25s;
        }

        .technology:hover {
            background: #174fc7;
            transform: translateY(-3px);
        }


        /* =====================================================
           EXPLORE
        ====================================================== */

        .explore-section {
            margin-top: 100px;
        }

        .explore-title {
            text-align: center;
            font-size: 26px;
            font-weight: bold;
            margin-bottom: 40px;
        }

        .explore-card {
            background: white;
            min-height: 150px;
            padding: 28px 30px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.08);
            cursor: pointer;
            transition: 0.3s;
            border: 1px solid transparent;
        }

        .explore-card:hover {
            transform: translateY(-6px);
            border-color: #dbe5ff;
            box-shadow: 0 12px 30px rgba(0,0,0,0.12);
        }

        .explore-card h5 {
            color: #2864e8;
            font-weight: bold;
            font-size: 18px;
            margin-bottom: 18px;
        }

        .explore-card p {
            color: #222;
            margin: 0;
            line-height: 1.6;
        }

        .explore-icon {
            color: #2864e8;
            font-size: 25px;
            float: right;
        }


        /* =====================================================
           GENERAL PAGE TITLE
        ====================================================== */

        .page-header {
            text-align: center;
            margin-bottom: 50px;
        }

        .page-header h1 {
            font-size: 40px;
            font-weight: bold;
            color: #172033;
        }

        .page-header p {
            color: #667085;
            font-size: 17px;
            margin-top: 12px;
        }


        /* =====================================================
           COMMON CARD
        ====================================================== */

        .content-card {
            background: white;
            border-radius: 14px;
            padding: 28px;
            margin-bottom: 20px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.07);
            border: 1px solid #eeeeee;
            transition: 0.25s;
        }

        .content-card:hover {
            border-color: #d8e3ff;
            transform: translateY(-2px);
        }

        .content-card h4 {
            color: #1c2a43;
            font-weight: bold;
            margin-bottom: 15px;
        }

        .content-card h5 {
            color: #1c2a43;
            font-weight: bold;
            margin-bottom: 12px;
        }

        .content-card p {
            color: #4b5563;
            line-height: 1.8;
        }

        .content-card strong {
            color: #202938;
        }


        /* =====================================================
           ICON
        ====================================================== */

        .card-icon {
            color: #2864e8;
            font-size: 30px;
            flex-shrink: 0;
        }


        /* =====================================================
           PROJECT FEATURES
        ====================================================== */

        .project-features {
            color: #4b5563;
            line-height: 1.8;
            padding-left: 22px;
        }

        .project-features li {
            margin-bottom: 5px;
        }


        /* =====================================================
           SKILLS
        ====================================================== */

        .skill-title {
            color: #2864e8;
            font-size: 21px;
            font-weight: bold;
            margin: 30px 0 15px;
        }

        .skill-box {
            background: white;
            border: 1px solid #e5e7eb;
            border-radius: 10px;
            padding: 18px;
            text-align: center;
            font-weight: bold;
            color: #273246;
            box-shadow: 0 3px 12px rgba(0,0,0,0.05);
            transition: 0.25s;
        }

        .skill-box:hover {
            color: #2864e8;
            border-color: #2864e8;
            transform: translateY(-3px);
        }


        /* =====================================================
           CERTIFICATION
        ====================================================== */

        .certificate-card {
            display: flex;
            gap: 18px;
            align-items: flex-start;
        }

        .certificate-card i {
            color: #2864e8;
            font-size: 32px;
            flex-shrink: 0;
        }

        .cert-link {
            color: #2864e8;
            font-weight: bold;
            text-decoration: none;
        }

        .cert-link:hover {
            text-decoration: underline;
        }


        /* =====================================================
           CONTACT
        ====================================================== */

        .contact-item {
            margin-bottom: 20px;
            font-size: 20px;
        }

        .contact-item i {
            color: #2864e8;
            margin-right: 10px;
            font-size: 20px;
        }

        .contact-item a {
            color: #2864e8;
            text-decoration: none;
        }

        .contact-item a:hover {
            text-decoration: underline;
        }


        /* =====================================================
           BACK TO TOP
        ====================================================== */

        #backToTop {
            position: fixed;
            right: 25px;
            bottom: 25px;
            width: 45px;
            height: 45px;
            border: none;
            border-radius: 50%;
            background: #2864e8;
            color: white;
            font-size: 20px;
            display: none;
            z-index: 9998;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }

        #backToTop:hover {
            background: #174fc7;
        }


        /* =====================================================
           FOOTER
        ====================================================== */

        footer {
            background: #10172a;
            color: #aaa;
            text-align: center;
            padding: 25px;
        }

        footer span {
            color: #00c7b5;
        }


        /* =====================================================
           RESPONSIVE
        ====================================================== */

        @media (max-width: 991px) {

            .navbar {
                padding: 10px 0;
            }

            .navbar-nav {
                padding-top: 15px;
            }

            .navbar-nav .nav-link {
                padding: 10px !important;
            }

            .home-section {
                padding-top: 40px;
            }

            .home-title {
                font-size: 48px;
            }

            .hero-image-wrapper {
                width: 300px;
                height: 300px;
                margin-top: 50px;
            }

        }


        @media (max-width: 576px) {

            .page {
                padding: 40px 0 60px;
            }

            .home-title {
                font-size: 40px;
            }

            .home-role {
                font-size: 21px;
            }

            .home-tech {
                font-size: 16px;
            }

            .hero-image-wrapper {
                width: 260px;
                height: 260px;
            }

            .stats-section,
            .core-section,
            .explore-section {
                margin-top: 60px;
            }

            .page-header h1 {
                font-size: 32px;
            }

            .content-card {
                padding: 20px;
            }

        }


  /* =========================
           FORM
        ========================= */

        .form-control {

            width: 100%;

            padding: 13px;

            border: 1px solid #d0d5dd;

            border-radius: 8px;

            margin-bottom: 15px;

            font-size: 16px;

        }


        .form-control:focus {

            border-color: #1769ff;

            box-shadow: 0 0 0 2px rgba(23,105,255,0.1);

        }


        textarea.form-control {

            height: 150px;

            resize: vertical;

        }


        /* =========================
           SEND BUTTON
        ========================= */

        .send-btn {

            width: 100%;

            background-color: #1769ff;

            color: white;

            border: none;

            padding: 13px;

            border-radius: 8px;

            font-size: 16px;

            font-weight: 600;

            cursor: pointer;

        }


        .send-btn:hover {

            background-color: #0d52d9;

        }


        

          /* =========================
           FOOTER
        ========================= */

        footer {

            background-color: #101827;

            color: #aaa;

            text-align: center;

            padding: 20px;

            margin-top: 70px;

        }


        /* =========================
           RESPONSIVE
        ========================= */

        @media (max-width: 768px) {

            .contact-section {

                grid-template-columns: 1fr;

            }


            .contact-heading h1 {

                font-size: 32px;

            }


            .navbar-nav .nav-link {

                margin-left: 0;

                margin-top: 8px;

            }

        }
   </style>
